<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <div id="divUno">

            <input placeholder="Primer Numero" type="number" id="numero1">
            
    </div>

    <div id="divDos">

        <button id="inverso">1/x</button>
        <button id="potencia">x^2</button>
        <button id="raiz">√2</button>
        <button id="division">/</button>

    </div>

    <div id="divTres">

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button id="multiplicacion">x</button>

    </div>

     <div id="divCuatro">

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button id="resta">-</button>

    </div>

     <div id="divCinco">

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button id="suma">+</button>

    </div>

     <div id="divSeis">

        <button>+/-</button>
        <button>0</button>
        <button>,</button>
        <button id="igual">=</button>

    </div>

     <div id="divSiete">

       <h3 type="number" id="Resultado">Resultado: </h3>

    </div>

    


    <script src="script.js"></script>
</body>
</html>
